<!DOCTYPE html>

<html>
    <head>
        <title>Lab Task 01</title>
    </head>
    
    <body>
       
            <h1>Internship Confirmation Form</h1>
        
        
        <form>
            Student Name: 
            <input type="text" name="name" required>
            <br><br>
            
            Email Address: 
            <input type="email" name="email" required>
            <br><br>
            
            Preferred Internship Type: <br>
            <input type="radio" name="type" value="onsite"> On-Site <br>
            <input type="radio" name="type" value="remote"> Remote
            <br><br>
            
            Internship Duration: 
            <select name="duration">
                <option>6 Weeks</option>
                <option>3 Months</option>
            </select>
            <br><br>
            
            Skills of Interest: <br>
            <input type="checkbox" name="skill1"> Web Development <br>
            <input type="checkbox" name="skill2"> Data Analysis <br>
            <input type="checkbox" name="skill3"> Mobile Apps
            <br><br>
            
            <input type="submit" value="Submit">
        </form>
    </body>
</html>
